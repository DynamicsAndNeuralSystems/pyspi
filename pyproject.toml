[build-system]
# >=77 for PEP 639: the `license = "GPL-3.0-or-later"` SPDX expression and
# `license-files` below are only understood from that release, and older
# setuptools would build a wheel with no licence metadata at all.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspi"
version = "3.0.0"
description = "Library for pairwise analysis of time series data."
readme = "README.md"
# PEP 639 SPDX expression. The `{ text = ... }` table is deprecated by
# setuptools >= 77 and emits a build warning that will become an error.
license = "GPL-3.0-or-later"
# The vendored notices go in the wheel's licence metadata as well as in
# package data: `pyspi/lib/ids/` and the four pairwise causal scores in
# `pyspi/lib/pairwise_causal.py` carry their own (MIT) terms, and
# `pyspi/statistics/infotheory.py` follows JIDT (GPL-3.0-or-later). A
# redistributor reading only the dist-info should see them.
license-files = ["LICENSE.txt", "pyspi/lib/LICENSE-cdt.txt",
                 "pyspi/lib/LICENSE-jidt.txt", "pyspi/lib/ids/LICENSE.txt"]
requires-python = ">=3.11"
authors = [
    { name = "Oliver M. Cliff", email = "oliver.m.cliff@gmail.com" },
    { name = "Ben D. Fulcher", email = "ben.fulcher@sydney.edu.au" },
    { name = "Will R. Edibam", email = "will.edibam@sydney.edu.au" },
]
maintainers = [
    { name = "Joshua B. Moore", email = "joshua.moore@sydney.edu.au" },
    { name = "Ben D. Fulcher", email = "ben.fulcher@sydney.edu.au" },
    { name = "Will R. Edibam", email = "will.edibam@sydney.edu.au" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Every floor is a release that installs and runs with NumPy 2 on Python
    # 3.11; the comments give the reasons that are specific to one package.
    "numpy>=2.0",
    # 1.13 is the first release that supports NumPy 2.
    "scipy>=1.13",
    # 2.2.2 is the first release built against NumPy 2; earlier wheels that do
    # not cap numpy<2 fail to import under it ("numpy.dtype size changed").
    "pandas>=2.2.2",
    "scikit-learn>=1.8",
    # 0.14.2 is the first release built against NumPy 2; earlier wheels fail
    # to import under it, as for pandas.
    "statsmodels>=0.14.2",
    "mne>=1.6",
    "mne-connectivity>=0.5",
    # DirectedCoherence reads two private Connectivity properties
    # (_transfer_function, _noise_covariance), because the public
    # directed_coherence() does not compute the bounded form pyspi reports
    # (see statistics/spectral.py). 1.x returns a frequency grid without the
    # Nyquist bin, which changes the band statistics, so the floor is 2.0; the
    # upper bound excludes a major release that may remove either property.
    "spectral-connectivity>=2.0,<3",
    # 0.11 is the first release that supports NumPy 2.
    "nitime>=0.11",
    # hyppo imports the `future` package, which 0.5.2 is the first release to
    # declare as a dependency.
    "hyppo>=0.5.2",
    "tslearn>=0.10",
    # Used directly by the Itakura DTW kernel (statistics/distance.py);
    # tslearn requires the same floor.
    "numba>=0.61",
    # 2.3.12 is the first release whose C library builds on Python 3.11 with
    # NumPy 2; earlier source distributions fail to build or build without it.
    "dtaidistance>=2.3.12",
    # ConvergentCrossMapping reproduces pyEDM 2.5's CCM, including its random
    # libraries and their seeding.
    "pyEDM>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "colorama>=0.4",
]

[project.optional-dependencies]
testing = [
    "pytest>=7",
]
# Optional: only required for loading the sktime/aeon .ts dataset format.
tsfile = [
    "aeon>=1.0",
]
# Optional: the compute-cost benchmark suite and its analysis notebook (bench/).
# Not needed to use pyspi.
bench = [
    "psutil>=5.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[project.scripts]
pyspi = "pyspi.__main__:main"

[project.urls]
Homepage = "https://github.com/DynamicsAndNeuralSystems/pyspi"
Documentation = "https://time-series-features.gitbook.io/pyspi/"

[tool.pytest.ini_options]
# Default: skip the slow suite (test_baseline_drift.py plus the cache-sharing
# sweep in test_cache_keys.py; ~2 min on a 2024 laptop).
# Run everything with: pytest -m ''
# Run only regression: pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "slow: regression suite against frozen baseline SPI tables (run with -m slow)",
]

[tool.setuptools.packages.find]
include = ["pyspi*"]

[tool.setuptools.package-data]
# Globs, so that every bundled config and dataset ships without being listed.
pyspi = [
    "configs/*.yaml",
    "data/*.npy",
]
"pyspi.lib" = ["LICENSE-cdt.txt", "LICENSE-jidt.txt"]
"pyspi.lib.ids" = ["LICENSE.txt"]
