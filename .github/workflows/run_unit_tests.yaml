name: Unit Testing Pipeline

on: [push, pull_request]

# Supersede in-flight runs for the same ref; keep runs on different refs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install pyspi
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[testing]'

      - name: Run unit tests
        # pyproject.toml sets addopts = "-m 'not slow'", so the baseline-drift
        # suite is excluded here by design. See run_slow_tests.yaml for that.
        run: pytest -q
