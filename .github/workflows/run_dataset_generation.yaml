name: Generate benchmarking dataset tables

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    # Regenerating the baselines runs the full calculator many times over.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Baselines are frozen against uv.lock; regenerate from the same
      # resolution so they stay comparable with the blocking regression job.
      - name: Install pyspi from the lock
        run: uv sync --locked

      - name: Run data generation
        run: uv run python tests/tools/generate_benchmark_tables.py --dataset all

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-tables
          # Glob rather than a fixed filename so this keeps working regardless of
          # which baselines the script writes and what it names them.
          path: tests/data/baselines/*.npz
          if-no-files-found: error
