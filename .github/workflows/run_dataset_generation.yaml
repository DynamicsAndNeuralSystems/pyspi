name: Generate benchmarking dataset tables

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    # Regenerating the baselines runs the full calculator many times over.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install pyspi
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run data generation
        run: python tests/tools/generate_benchmark_tables.py --dataset all

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-tables
          # Glob rather than a fixed filename so this keeps working regardless of
          # which baselines the script writes and what it names them.
          path: tests/data/baselines/*.npz
          if-no-files-found: error
