# benchmarked_p95: about the cheapest 95% of the 231 SPIs in `full`, ranked by
# amortized cost (SPIs that share a cache split its cost) at M = 16, T = 1000
# on one core, with cache groups kept whole.
# Current set: 213 SPIs (of the 231 in `full`).
# Placed by hand (see bench/README.md): softdtw, bary_dtw_corr (cost grows about as T^2
# or faster) and lccm_E-None_k-5_{skill,tp} (ccm_* covers the method) are below the cutoff
# but in p99 only; lcss and hsic_biased are in p99 only (lcss_constraint-itakura and hsic
# track them).
#
.statistics.basic:
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
    - estimator: EmpiricalCovariance
    - estimator: MinCovDet

  PartialCorrelation:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
    - estimator: EmpiricalCovariance
    - estimator: GraphicalLasso
    - estimator: LedoitWolf
    - estimator: MinCovDet
    - estimator: OAS
    - estimator: ShrunkCovariance

  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
    - squared: false

  ChatterjeeXi:
    labels:
      - directed
      - nonlinear
      - bivariate
      - M14
    dependencies:
    configs:
    - tau: 0
      labels:
      - contemporaneous
    - tau: 1
      labels:
      - time-dependent

  LagResolvedCorrelation:
    labels:
      - linear
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
    - statistic: lag
      labels:
      - antisymmetric
      - signed
      - timing
    - statistic: peak
      labels:
      - undirected
      - signed
    - statistic: asym
      labels:
      - antisymmetric
      - signed
    - statistic: onesided
      tau: 1
      labels:
      - directed
      - signed
    - statistic: onesided
      tau: 2
      labels:
      - directed
      - signed
    - statistic: onesided
      tau: 3
      labels:
      - directed
      - signed
    - statistic: onesided
      tau: 5
      labels:
      - directed
      - signed
    - statistic: onesided
      tau: 10
      labels:
      - directed
      - signed
    - statistic: onesided
      tau: 1e
      labels:
      - directed
      - signed
    - statistic: onesidedpeak
      labels:
      - directed
    - statistic: lag
      max_lag: 10
      labels:
      - antisymmetric
      - signed
      - timing
    - statistic: peak
      max_lag: 10
      labels:
      - undirected
      - signed
    - statistic: asym
      max_lag: 10
      labels:
