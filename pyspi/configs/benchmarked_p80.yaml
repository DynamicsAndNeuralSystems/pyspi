  CrossmapEntropy:
    labels:
      - unsigned
      - directed
      - time-dependent
      - bivariate
      - MXX
    configs:
    - estimator: gaussian
      history_length: 1
    - estimator: kozachenko
      history_length: 1
    - estimator: kernel
      history_length: 1
    - estimator: gaussian
      history_length: 10
    # - estimator: kozachenko
    #   history_length: 10
    # - estimator: kernel
    #   history_length: 10

  DirectedInfo:
      # Disabled: composing directed information from four separately-estimated
      # entropies leaves each with its own dimension-dependent bias, and they do
      # not cancel. On independent data the kernel variant sat at 3.8-4.4 for
      # every T from 100 to 8000 (a fixed bandwidth in ~11 dimensions does not
      # improve with sample size) and kozachenko returned negatives, for a
      # quantity bounded below by zero. Use estimator: kraskov, which estimates
      # each conditional-MI term directly.
      # - estimator: kernel
      # - estimator: kozachenko

    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
    - estimator: gaussian
    # - estimator: kernel

  StochasticInteraction:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
    - estimator: gaussian
      labels:
      - M05
    - estimator: kozachenko
    # - estimator: kernel

  MutualInfo:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
    - estimator: gaussian
    - estimator: kraskov
      prop_k: 4
    - estimator: kraskov
      prop_k: 4
      dyn_corr_excl: AUTO
    - estimator: kernel
      kernel_width: 0.25

  TimeLaggedMutualInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
    - estimator: gaussian
    - estimator: kernel
      kernel_width: 0.25
    # - estimator: kraskov
    #   prop_k: 4
    # - estimator: kraskov
    #   prop_k: 4
    #   dyn_corr_excl: AUTO

  TransferEntropy:
      # Disabled: k_history=1 gives a single ordinal symbol, so the transfer
      # entropy is identically zero. Rejected at construction; kept here as a
      # record of what was dropped.
      # - estimator: symbolic
      #   k_history: 1
      #   l_history: 1
      #   labels:
      #     - M05
      #
      # Disabled: severely undersampled and unvalidated at T=100. 10! symbols
      # against ~91 usable samples: on var1 and cml every joint count is 1, so
      # the value tracks sample size rather than dependence, but that does not
      # hold universally (kuramoto: 3 of 42 pairs). Still constructible, and
