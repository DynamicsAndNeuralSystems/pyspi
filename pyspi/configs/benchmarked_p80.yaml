# benchmarked_p80: the fastest 80% of the SPIs timed in pyspi's compute-cost
# benchmark, ranked by amortized cost (SPIs that share a cache split its cost)
# at M = 16, T = 800 on one core.
# Current set: 145 SPIs (of the 231 in `full`).
# SPIs of `full` that the benchmark did not time are in no benchmarked_p* set,
# whatever their cost; use `full` for them.
#
.statistics.basic:
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
    - estimator: EmpiricalCovariance
    - estimator: MinCovDet

  # Partial correlation
  PartialCorrelation:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
    - estimator: EmpiricalCovariance
    - estimator: GraphicalLasso
    - estimator: LedoitWolf
    - estimator: MinCovDet
    - estimator: OAS
    - estimator: ShrunkCovariance

  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
    - squared: false

  # Chatterjee's rank correlation xi
  ChatterjeeXi:
    labels:
      - directed
      - nonlinear
      - bivariate
      - M14
    dependencies:
    configs:
    - tau: 0
      labels:
      - contemporaneous
    - tau: 1
      labels:
      - time-dependent

  # Lag-resolved cross-correlation
  LagResolvedCorrelation:
    labels:
      - linear
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: lag
        labels:
          - antisymmetric
          - signed
          - timing
      - statistic: peak
        labels:
          - undirected
          - signed
      - statistic: asym
        labels:
          - antisymmetric
          - signed
      - statistic: onesided
        tau: 1
        labels:
          - directed
          - signed
      - statistic: onesided
        tau: 2
        labels:
          - directed
          - signed
      - statistic: onesided
        tau: 3
        labels:
          - directed
          - signed
      - statistic: onesided
        tau: 5
        labels:
          - directed
          - signed
      - statistic: onesided
        tau: 10
        labels:
          - directed
          - signed
      - statistic: onesided
        tau: "1e"
        labels:
          - directed
          - signed
      - statistic: onesidedpeak
        labels:
          - directed
      - statistic: lag
        max_lag: 10
        labels:
          - antisymmetric
          - signed
          - timing
      - statistic: peak
        max_lag: 10
        labels:
          - undirected
          - signed
      - statistic: asym
        max_lag: 10
        labels:
          - antisymmetric
          - signed

