# Pearson and Spearman correlation statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True

# Directed information with a Gaussian density estimator
.statistics.infotheory:
  DirectedInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
      - estimator: gaussian

# Power envelope correlation
.statistics.misc:
  PowerEnvelopeCorrelation:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - time-dependent
      - M11
    dependencies:
    configs:
      - orth: False
        log: False
        absolute: False
