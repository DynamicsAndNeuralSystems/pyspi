# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Precision
  Precision:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: LedoitWolf
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Partial correlation
  PartialCorrelation:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: LedoitWolf

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Kendall's rank correlation coefficient
  KendallTau:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Chatterjee's rank correlation xi
  ChatterjeeXi:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - M14
    dependencies:
    configs:
      - tau: 0
        labels:
          - contemporaneous

  # Cross correlation
  CrossCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: "max"
        labels:
          - M10

      - statistic: "max"
        squared: True

      - statistic: "mean"

      - statistic: "mean"
        squared: True

      - statistic: "mean"
        sigonly: False

      - statistic: "mean"
        squared: True
        sigonly: False

# Distance-based statistics
.statistics.distance:
  # Pairwise distance
  PairwiseDistance:
    labels:
      - unsigned
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:
      - metric: "euclidean"
      - metric: "cityblock"
      - metric: "cosine"
      - metric: "chebyshev"
      - metric: "canberra"
      - metric: "braycurtis"

  # Distance correlation
  DistanceCorrelation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Hilbert-Schmidt independence criterion
  HilbertSchmidtIndependenceCriterion:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Barycenter
  Barycenter:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - mode: euclidean
        statistic: max

      - mode: euclidean
        statistic: mean
        squared: True

      - mode: euclidean
        statistic: max
        squared: True
        
  # Gromov-Wasserstein distance (GW_tau)
  GromovWasserstainTau:
    labels:
      - unsigned
      - distance
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:

# Causal inference statistics
.statistics.causal:
  # Additive noise model
  AdditiveNoiseModel:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Conditional distribution similarity statistic
  ConditionalDistributionSimilarity:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Regression error-based causal inference
  RegressionErrorCausalInference:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Liang-Kleeman information flow
  LiangInformationFlow:
    labels:
      - directed
      - linear
      - signed
      - time-dependent
      - M14
    dependencies:
    configs:
      - k: 1
        conditional: False
        statistic: normalised
        labels:
          - bivariate

# Information-theoretic statistics
.statistics.infotheory:
  # Joint entropy
  JointEntropy:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian
      - estimator: kozachenko
      - estimator: kernel

  # Conditional entropy
  ConditionalEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
    - estimator: gaussian
    - estimator: kernel

  # Cross-map entropy
  CrossmapEntropy:
    labels:
      - unsigned
      - directed
      - time-dependent
      - bivariate
      - MXX
    configs:
      - estimator: gaussian
        history_length: 1

      - estimator: kozachenko
        history_length: 1

      - estimator: kernel
        history_length: 1

      - estimator: gaussian
        history_length: 10

      - estimator: kozachenko
        history_length: 10


  # Stochastic interaction
  StochasticInteraction:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian
        labels:
          - M05
      - estimator: kozachenko
      - estimator: kernel

  # Mutual information
  MutualInfo:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

  # Time-lagged mutual information
  TimeLaggedMutualInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

  # Transfer entropy
  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M04
    configs:
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1
        dyn_corr_excl: AUTO

      - estimator: gaussian
        k_history: 1
        l_history: 1
        labels:
          - M05
# Spectral (frequency-domain) statistics (see Schoegl and Supp, 2006)
