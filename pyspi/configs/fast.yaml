# Wavelet (time-frequency) statistics, from Morlet wavelets
.statistics.wavelet:
  # Phase slope index (wavelet)
  PhaseSlopeIndex:
    labels:
      - antisymmetric
      - linear
      - signed
      - frequency-dependent
      - bivariate
      - M08
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

# Miscellaneous statistics
.statistics.misc:
  # Cointegration
  Cointegration:
    labels:
      - linear
      - bivariate
      - time-dependent
      - M13
    dependencies:
    configs:
      - method: johansen
        statistic: max_eig_stat
        det_order: 0
        k_ar_diff: 10
        labels:
          - undirected

      - method: johansen
        statistic: trace_stat
        det_order: 0
        k_ar_diff: 10
        labels:
          - undirected

      - method: johansen
        statistic: max_eig_stat
        det_order: 0
        k_ar_diff: 1
        labels:
          - undirected

      - method: johansen
        statistic: trace_stat
        det_order: 0
        k_ar_diff: 1
        labels:
          - undirected

      - method: johansen
        statistic: max_eig_stat
        det_order: 1
        k_ar_diff: 10
        labels:
          - undirected

      - method: johansen
        statistic: trace_stat
        det_order: 1
        k_ar_diff: 10
        labels:
          - undirected

      - method: johansen
        statistic: max_eig_stat
        det_order: 1
        k_ar_diff: 1
        labels:
          - undirected

      - method: johansen
        statistic: trace_stat
        det_order: 1
        k_ar_diff: 1
        labels:
          - undirected

      - method: aeg
        statistic: tstat
        autolag: aic
        maxlag: 10
        trend: c
        labels:
          - directed

      - method: aeg
        statistic: tstat
        autolag: aic
        maxlag: 10
        trend: ct
        labels:
          - directed

      - method: aeg
        statistic: tstat
        autolag: bic
        maxlag: 10
        trend: ct
        labels:
          - directed

  # Power envelope correlation
  PowerEnvelopeCorrelation:
    labels:
      - undirected
      - linear
      - bivariate
      - time-dependent
      - M11
    dependencies:
    configs:
      - orth: False
        log: False
        absolute: False
        labels:
          - signed

      - orth: True
        log: False
        absolute: False
        labels:
          - signed

      - orth: False
        log: True
        absolute: False
        labels:
          - signed

      - orth: True
        log: True
        absolute: False
        labels:
          - signed

      - orth: True
        log: False
        absolute: True

      - orth: True
        log: True
        absolute: True

  # Edge time series (coupling nonstationarity)
  EdgeTimeSeries:
    labels:
      - undirected
      - nonlinear
      - signed
      - profile
      - bivariate
      - time-dependent
      - M11
    dependencies:
    configs:
      - statistic: excessvar

  # Interdependence score
  InterDependenceScore:
    labels:
      - undirected
      - nonlinear
      - bivariate
      - contemporaneous
      - MXX
    dependencies:
    configs:
      - terms: 6
        pnorm: 'max'
        bandwidth: 0.5

# Vector autoregressive (VAR) model statistics
.statistics.var:
  # Conditional Granger causality
  ConditionalGrangerCausality:
    labels:
      - directed
      - linear
      - multivariate
      - time-dependent
      - M05
    dependencies:
    configs:
      - order: bic

  # Conditional partial directed coherence
  ConditionalPartialDirectedCoherence:
    labels:
      - directed
      - linear
      - multivariate
      - frequency-dependent
      - M06
    dependencies:
    configs:
      - order: bic

  # Partial coherence
  PartialCoherence:
    labels:
      - undirected
      - linear
      - multivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - order: bic

# Event and extreme-value statistics
.statistics.events:
  # Event synchronisation
  EventSynchronisation:
    labels:
      - antisymmetric
      - nonlinear
      - signed
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: q
        quantile: 0.95

  # Tail-dependence asymmetry
  TailDependenceAsymmetry:
    labels:
      - undirected
      - nonlinear
      - signed
      - profile
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - quantile: 0.95
