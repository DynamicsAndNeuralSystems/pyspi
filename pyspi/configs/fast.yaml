# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance

  # Partial correlation
  PartialCorrelation:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: LedoitWolf

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: False

  # Chatterjee's rank correlation xi
  ChatterjeeXi:
    labels:
      - directed
      - nonlinear
      - bivariate
      - M14
    dependencies:
    configs:
      - tau: 0
        labels:
          - contemporaneous

  # Lag-resolved cross-correlation
  LagResolvedCorrelation:
    labels:
      - linear
      - signed
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: lag
        labels:
          - antisymmetric
          - timing
      - statistic: peak
        labels:
          - undirected
      - statistic: asym
        labels:
          - antisymmetric
      - statistic: onesided
        tau: 1
        labels:
          - directed

# Distance-based statistics
.statistics.distance:
  # Pairwise distance
  PairwiseDistance:
    labels:
      - unordered
      - nonlinear
      - undirected
      - bivariate
      - contemporaneous
      - MXX
    dependencies:
    configs:
      - metric: "cityblock"
      - metric: "chebyshev"
      - metric: "canberra"
      - metric: "braycurtis"

  # Distance correlation
  DistanceCorrelation:
    labels:
      - undirected
      - nonlinear
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Hilbert-Schmidt independence criterion
  HilbertSchmidtIndependenceCriterion:
    labels:
      - undirected
      - nonlinear
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

# Causal inference statistics
.statistics.causal:
  # Additive noise model
  AdditiveNoiseModel:
    labels:
      - directed
      - nonlinear
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Conditional distribution similarity statistic
  ConditionalDistributionSimilarity:
    labels:
      - directed
      - nonlinear
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Regression error-based causal inference
  RegressionErrorCausalInference:
    labels:
      - directed
      - nonlinear
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Nonlinear interdependence
  NonlinearInterdependence:
    labels:
      - directed
      - nonlinear
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: L
        m: 5
        tau: 1
        k: 5

  # Liang-Kleeman information flow
  LiangInformationFlow:
    labels:
      - directed
      - linear
      - signed
      - time-dependent
      - M14
    dependencies:
    configs:
      - k: 1
        conditional: False
        statistic: normalised
        labels:
          - bivariate

# Information-theoretic statistics
.statistics.infotheory:
  # Joint entropy
  JointEntropy:
    labels:
      - undirected
      - nonlinear
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: kozachenko
      - estimator: kernel

  # Conditional entropy
  ConditionalEntropy:
    labels:
      - directed
      - nonlinear
      - bivariate
      - contemporaneous
      - M14
    configs:
    - estimator: kernel

  # Cross-map entropy
  CrossmapEntropy:
    labels:
      - directed
      - time-dependent
      - bivariate
      - MXX
    configs:
      - estimator: gaussian
        history_length: 1

      - estimator: kozachenko
        history_length: 1

      - estimator: kernel
        history_length: 1

      - estimator: gaussian
        history_length: 10

      - estimator: kozachenko
        history_length: 10


  # Stochastic interaction
  StochasticInteraction:
    labels:
      - undirected
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian
        labels:
          - M05
      - estimator: kozachenko
      - estimator: kernel

  # Mutual information
  MutualInfo:
    labels:
      - undirected
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

      - estimator: kernel
        kernel_width: 0.25
        dyn_corr_excl: AUTO

  # Time-lagged mutual information
  TimeLaggedMutualInfo:
    labels:
      - directed
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

      - estimator: kernel
        kernel_width: 0.25
        dyn_corr_excl: AUTO

  # Transfer entropy
  TransferEntropy:
    labels:
      - directed
      - bivariate
      - time-dependent
      - M04
    configs:
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1
        dyn_corr_excl: AUTO

      - estimator: gaussian
        k_history: 1
        l_history: 1
        labels:
          - M05
# Spectral (frequency-domain) statistics (see Schoegl and Supp, 2006)
.statistics.spectral:
  # Coherence phase
  CoherencePhase:
    labels:
      - linear
      - signed
      - timing
      - antisymmetric
      - bivariate
      - frequency-dependent
      - M01
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

  # Magnitude-squared coherence
  CoherenceMagnitude:
    labels:
      - undirected
      - linear
      - bivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  # Imaginary coherence
  ImaginaryCoherence:
    labels:
      - undirected
      - linear
      - bivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  # Phase slope index
  PhaseSlopeIndex:
    labels:
      - antisymmetric
      - linear
      - signed
      - bivariate
      - frequency-dependent
      - M01
    dependencies:
    configs:
      - fmin: 0
        fmax: 0.5

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

  # Phase locking value
  PhaseLockingValue:
    labels:
      - undirected
      - linear
      - bivariate
      - frequency-dependent
      - M10
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max
        labels:
          - M12

      - fmin: 0
        fmax: 0.25
        statistic: max
        labels:
          - M12

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  # Phase lag index
  PhaseLagIndex:
    labels:
      - antisymmetric
      - linear
      - signed
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1
        labels:
          - M14

      - fmin: 0
        fmax: 0.25
        labels:
          - M01

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M01


  # Weighted phase lag index
  WeightedPhaseLagIndex:
    labels:
      - antisymmetric
      - linear
      - signed
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1
        labels:
          - M14

      - fmin: 0
        fmax: 0.25
        labels:
          - M01

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M01


  # Debiased squared phase lag index
  DebiasedSquaredPhaseLagIndex:
    labels:
      - undirected
      - linear
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1
        labels:
          - M12

      - fmin: 0
        fmax: 0.25
        labels:
          - M12

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M12

  # Debiased squared weighted phase-lag index
  DebiasedSquaredWeightedPhaseLagIndex:
    labels:
      - undirected
      - linear
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1
        labels:
          - M12

      - fmin: 0
        fmax: 0.25
        labels:
          - M12

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M12

  # Directed coherence
  DirectedCoherence:
    labels:
      - directed
      - linear
      - bivariate
      - frequency-dependent
      - M06
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
