# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: MinCovDet
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: GraphicalLassoCV
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: MinCovDet
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Precision
  Precision:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: MinCovDet
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: GraphicalLassoCV
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: MinCovDet
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Kendall's rank correlation coefficient
  KendallTau:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Chatterjee's rank correlation xi
  ChatterjeeXi:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - M14
    dependencies:
    configs:
      - tau: 0
        labels:
          - contemporaneous
      - tau: 1
        labels:
          - time-dependent

  # Lagged correlation coefficient
  LaggedCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
      - MXX
    dependencies:
    configs:
      - estimator: pearson
        max_tau: 5
        squared: False
      - estimator: pearson
        max_tau: 5
        squared: True
      - estimator: pearson
        tau: 10
        squared: False
      - estimator: pearson
        tau: 10
        squared: True
      - estimator: pearson
        tau: 20
        squared: False
      - estimator: pearson
        tau: 20
        squared: True
      - estimator: spearman
        max_tau: 5
        squared: False
      - estimator: spearman
        max_tau: 5
        squared: True
      - estimator: spearman
        tau: 10
        squared: False
      - estimator: spearman
        tau: 10
        squared: True
      - estimator: spearman
        tau: 20
        squared: False
      - estimator: spearman
        tau: 20
        squared: True
      - estimator: kendall
        max_tau: 5
        squared: False
      - estimator: kendall
        max_tau: 5
        squared: True
      - estimator: kendall
        tau: 10
        squared: False
      - estimator: kendall
        tau: 10
        squared: True
      - estimator: kendall
        tau: 20
        squared: False
      - estimator: kendall
        tau: 20
        squared: True

  # statistics based on cross-correlation (squared means we square the xcorr, not the output)
  CrossCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: "max"
        labels:
          - M10

      - statistic: "max"
        squared: True

      - statistic: "mean"

      - statistic: "mean"
        squared: True

      - statistic: "mean"
        sigonly: False

      - statistic: "mean"
        squared: True
        sigonly: False

.statistics.distance:
  PairwiseDistance:
    labels:
      - unsigned
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:
      - metric: "euclidean"
      - metric: "cityblock"
      - metric: "cosine"
      - metric: "chebyshev"
      - metric: "canberra"
      - metric: "braycurtis"

  # Distance correlation
  DistanceCorrelation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Multi-scale graph correlation
  MultiscaleGraphCorrelation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Hilbert-Schmidt independence criterion
  HilbertSchmidtIndependenceCriterion:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Heller-Heller-Gorfine (HHG) test
  HellerHellerGorfine:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Multi-scale graph correlation for time series
  CrossMultiscaleGraphCorrelation:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - max_lag: 1
      - max_lag: 10

  # Distance correlation for time series
  CrossDistanceCorrelation:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - max_lag: 1
      - max_lag: 10

  DynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  # Cross pairwise distance
  CrossPairwiseDistance:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - MXX
    dependencies:
    configs:
      - metric: "euclidean"
        tau: 1
        statistic: "min"
      - metric: "euclidean"
        tau: 1
        statistic: "mean"

  SoftDynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  LongestCommonSubsequence:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  Barycenter:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - mode: euclidean
        statistic: max
      - mode: dtw
        statistic: corr
        labels:
          - M09
      - mode: dtw
        statistic: max
      - mode: sgddtw
        statistic: corr
        labels:
          - M09
      - mode: sgddtw
        statistic: max
      - mode: softdtw
        statistic: corr
        labels:
          - M09
      - mode: softdtw
        statistic: max

      - mode: euclidean
        statistic: mean
        squared: True

      - mode: euclidean
        statistic: max
        squared: True

      - mode: dtw
        statistic: max
        squared: True

      - mode: sgddtw
        statistic: max
        squared: True

      - mode: softdtw
        statistic: max
        squared: True

  # Gromov-Wasserstain Distance
  GromovWasserstainTau:
    labels:
      - unsigned
      - distance
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:

.statistics.causal:
  # Additive noise model
  AdditiveNoiseModel:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Conditional distribution similarity statistic
  ConditionalDistributionSimilarity:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Regression error-based causal inference
  RegressionErrorCausalInference:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Convergent-cross mapping
  ConvergentCrossMapping:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: mean
      - statistic: max
      - statistic: diff
      - statistic: mean
        embedding_dimension: 1
      - statistic: max
        embedding_dimension: 1
      - statistic: diff
        embedding_dimension: 1
      - statistic: mean
        embedding_dimension: 10
      - statistic: max
        embedding_dimension: 10
      - statistic: diff
        embedding_dimension: 10

# Information-theoretic statistics
.statistics.infotheory:
  JointEntropy: # No theiler window yet
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian
      - estimator: kozachenko
      - estimator: kernel

  ConditionalEntropy: # No theiler window yet
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian
      - estimator: kozachenko
      - estimator: kernel

  CausalEntropy: # No theiler window yet
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
      - estimator: gaussian
      - estimator: kozachenko

  CrossmapEntropy: # No theiler window yet
    labels:
      - unsigned
      - directed
      - time-dependent
      - bivariate
      - MXX
    configs:
      - estimator: gaussian
        history_length: 1

      - estimator: kozachenko
        history_length: 1

      - estimator: kernel
        history_length: 1

      - estimator: gaussian
        history_length: 10

      - estimator: kozachenko
        history_length: 10


  DirectedInfo: # No theiler window yet
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
      - estimator: gaussian
      - estimator: kraskov
        prop_k: 4

  StochasticInteraction: # No theiler window
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian
        labels:
          - M05
      - estimator: kozachenko
      - estimator: kernel

  # Mutual information
  MutualInfo:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

  # Mutual information
  TimeLaggedMutualInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

  # Transfer entropy
  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M04
    configs:
      # Kraskov estimator with auto-embedding on source/target and DCE
      - estimator: kraskov
        prop_k: 4
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 4

      - estimator: kraskov
        prop_k: 4
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 4
        dyn_corr_excl: AUTO

      # Kraskov estimator with auto-embedding on target-only, src history of 1, and DCE
      - estimator: kraskov
        prop_k: 4
        k_history: 2
        l_history: 1
        dyn_corr_excl: AUTO

      # Kraskov estimator with fixed embedding of 1 for source/target and DCE
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1
        dyn_corr_excl: AUTO

      # Same as above with no DCE
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1

      # Kernel estimator with no auto-embedding on source/target and DCE
      - estimator: kernel
        kernel_width: 0.25
        k_history: 1
        labels:
          - M14

      - estimator: gaussian
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 2
        labels:
          - M05

      - estimator: gaussian
        k_history: 1
        l_history: 1
        labels:
          - M05

  IntegratedInformation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M05
    dependencies: 
    configs:
      - phitype: "star"

      - phitype: "star"
        normalization: 1

      - phitype: "Geo"

      - phitype: "Geo"
        normalization: 1

