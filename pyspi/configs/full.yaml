        order: 20
        method: parametric
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        order: 20
        method: parametric
        statistic: max

# statistics that analyse in the wavelet-domain (only Mortlet wavelet's at the moment)
.statistics.wavelet:
  PhaseSlopeIndex:
    labels:
      - unsigned
      - time/frequency dependent
      - bivariate
      - M08
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

.statistics.misc:
  LinearModel:
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - model: Ridge
      - model: SGDRegressor
      - model: BayesianRidge

  GPModel:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - kernel: DotProduct
      - kernel: RBF

  # Cointegration
  Cointegration:
    labels:
      - linear
      - unsigned
      - bivariate
      - time-dependent
      - M13
    dependencies:
    configs:
      - method: johansen
        statistic: max_eig_stat
        det_order: 0 # Constant trend
        k_ar_diff: 10

      - method: johansen
        statistic: trace_stat
        det_order: 0
        k_ar_diff: 10

      - method: johansen
        statistic: max_eig_stat
        det_order: 0 # Constant trend
        k_ar_diff: 1

      - method: johansen
        statistic: trace_stat
        det_order: 0
        k_ar_diff: 1

      - method: johansen
        statistic: max_eig_stat
        det_order: 1 # Linear trend
        k_ar_diff: 10

      - method: johansen
        statistic: trace_stat
        det_order: 1
        k_ar_diff: 10

      - method: johansen
        statistic: max_eig_stat
        det_order: 1
        k_ar_diff: 1

      - method: johansen
        statistic: trace_stat
        det_order: 1
        k_ar_diff: 1

      - method: aeg
        statistic: tstat
        autolag: aic
        maxlag: 10
        trend: c

      - method: aeg
        statistic: tstat
        autolag: aic
        maxlag: 10
        trend: ct

      - method: aeg
        statistic: tstat
        autolag: bic
        maxlag: 10
        trend: ct

  # Power envelope correlation
  PowerEnvelopeCorrelation:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - time-dependent
      - M11
    dependencies:
    configs:
      - orth: False
        log: False
        absolute: False

      - orth: True
        log: False
        absolute: False

      - orth: False
        log: True
        absolute: False

      - orth: True
        log: True
        absolute: False

      - orth: True
        log: False
        absolute: True

      - orth: True
        log: True
        absolute: True

  # Interdependence score
  InterDependenceScore:
    labels:
      - unsigned
      - undirected
      - nonlinear
    dependencies:
    configs: # default params
      - terms: 6
        pnorm: 'max'
        bandwidth: 0.5
