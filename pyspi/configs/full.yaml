# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: EllipticEnvelope
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: MinCovDet
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: EllipticEnvelope
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: GraphicalLassoCV
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: MinCovDet
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Precision
  Precision:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: EllipticEnvelope
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: MinCovDet
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: EllipticEnvelope
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: GraphicalLassoCV
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: MinCovDet
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Kendall's rank correlation coefficient
  KendallTau:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Lagged correlation coefficient (fork-added; class in pyspi/statistics/basic.py)
  LaggedCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
      - MXX
    dependencies:
    configs:
      - estimator: pearson
        max_tau: 5
        squared: False
      - estimator: pearson
        max_tau: 5
        squared: True
      - estimator: pearson
        tau: 10
        squared: False
      - estimator: pearson
        tau: 10
        squared: True
      - estimator: pearson
        tau: 20
        squared: False
      - estimator: pearson
        tau: 20
        squared: True
      - estimator: spearman
        max_tau: 5
        squared: False
      - estimator: spearman
        max_tau: 5
        squared: True
      - estimator: spearman
        tau: 10
        squared: False
      - estimator: spearman
        tau: 10
        squared: True
      - estimator: spearman
        tau: 20
        squared: False
      - estimator: spearman
        tau: 20
        squared: True
      - estimator: kendall
        max_tau: 5
        squared: False
      - estimator: kendall
        max_tau: 5
        squared: True
      - estimator: kendall
        tau: 10
        squared: False
      - estimator: kendall
        tau: 10
        squared: True
      - estimator: kendall
        tau: 20
        squared: False
      - estimator: kendall
        tau: 20
        squared: True

  # statistics based on cross-correlation (squared means we square the xcorr, not the output)
  CrossCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: "max"
        labels:
          - M10

      - statistic: "max"
        squared: True

      - statistic: "mean"

      - statistic: "mean"
        squared: True

      - statistic: "mean"
        sigonly: False

      - statistic: "mean"
        squared: True
        sigonly: False

.statistics.distance:
  PairwiseDistance:
    labels:
      - unsigned
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:
      - metric: "euclidean"
      - metric: "cityblock"
      - metric: "cosine"
      - metric: "chebyshev"
      - metric: "canberra"
      - metric: "braycurtis"

  # Distance correlation
  DistanceCorrelation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Multi-scale graph correlation
  MultiscaleGraphCorrelation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Hilbert-Schmidt independence criterion
  HilbertSchmidtIndependenceCriterion:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Heller-Heller-Gorfine (HHG) test
  HellerHellerGorfine:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Multi-scale graph correlation for time series
  CrossMultiscaleGraphCorrelation:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - max_lag: 1
      - max_lag: 10

  # Distance correlation for time series
  CrossDistanceCorrelation:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - max_lag: 1
      - max_lag: 10

  DynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  # Cross pairwise distance (fork-added; class in pyspi/statistics/distance.py)
  # Shifted-path Euclidean upper bound on DTW.
  CrossPairwiseDistance:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - MXX
    dependencies:
    configs:
      - metric: "euclidean"
        tau: 1
        statistic: "min"
      - metric: "euclidean"
        tau: 1
        statistic: "mean"

  SoftDynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  LongestCommonSubsequence:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  Barycenter:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - mode: euclidean
        statistic: mean
      - mode: euclidean
        statistic: max
      - mode: dtw
        statistic: mean
        labels:
          - M09
      - mode: dtw
        statistic: max
      - mode: sgddtw
        statistic: mean
        labels:
          - M09
      - mode: sgddtw
        statistic: max
      - mode: softdtw
        statistic: mean
        labels:
          - M09
      - mode: softdtw
        statistic: max

      - mode: euclidean
        statistic: mean
        squared: True

      - mode: euclidean
        statistic: max
        squared: True

      - mode: dtw
        statistic: mean
        squared: True
        labels:
          - M09

      - mode: dtw
        statistic: max
        squared: True

      - mode: sgddtw
        statistic: mean
        squared: True
        labels:
          - M09

      - mode: sgddtw
        statistic: max
        squared: True

      - mode: softdtw
        statistic: mean
        squared: True
        labels:
          - M09

      - mode: softdtw
        statistic: max
        squared: True

  # Gromov-Wasserstain Distance
  GromovWasserstainTau:
    labels:
      - unsigned
      - distance
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:

.statistics.causal:
  # Additive noise model
  AdditiveNoiseModel:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Conditional distribution similarity statistic
  ConditionalDistributionSimilarity:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:

  # Regression error-based causal inference
  RegressionErrorCausalInference:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Information-geometric causal inference (disabled heuristic)
  # InformationGeometricCausalInference:
  #   labels:
  #     - directed
  #     - nonlinear
  #     - unsigned
  #     - bivariate
  #     - contemporaneous
  #   dependencies:
  #   configs:

  # Convergent-cross mapping
  ConvergentCrossMapping:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: mean
      - statistic: max
      - statistic: diff
      - statistic: mean
        embedding_dimension: 1
      - statistic: max
        embedding_dimension: 1
      - statistic: diff
        embedding_dimension: 1
      - statistic: mean
        embedding_dimension: 10
      - statistic: max
        embedding_dimension: 10
      - statistic: diff
        embedding_dimension: 10

# Information-theoretic statistics
.statistics.infotheory:
  JointEntropy: # No theiler window yet
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian
      - estimator: kozachenko
      - estimator: kernel

  ConditionalEntropy: # No theiler window yet
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian
      - estimator: kozachenko
      - estimator: kernel

  CausalEntropy: # No theiler window yet
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
      - estimator: gaussian
      - estimator: kozachenko
      - estimator: kernel

  CrossmapEntropy: # No theiler window yet
    labels:
      - unsigned
      - directed
      - time-dependent
      - bivariate
      - MXX
    configs:
      - estimator: gaussian
        history_length: 1

      - estimator: kozachenko
        history_length: 1

      - estimator: kernel
        history_length: 1

      - estimator: gaussian
        history_length: 10

      - estimator: kozachenko
        history_length: 10

      - estimator: kernel
        history_length: 10

  DirectedInfo: # No theiler window yet
      # Disabled: composing directed information from four separately-estimated
      # entropies leaves each with its own dimension-dependent bias, and they do
      # not cancel. On independent data the kernel variant sat at 3.8-4.4 for
      # every T from 100 to 8000 (a fixed bandwidth in ~11 dimensions does not
      # improve with sample size) and kozachenko returned negatives, for a
      # quantity bounded below by zero. Use estimator: kraskov, which estimates
      # each conditional-MI term directly.
      # - estimator: kernel
      # - estimator: kozachenko

    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
      - estimator: gaussian
      # Direct KSG/Frenzel-Pompe conditional-MI estimate. The kernel and
      # kozachenko variants were dropped because composing DI from separate
      # entropies leaves each with its own dimension-dependent bias; this
      # estimates each I(X^i; Y_i | Y^{i-1}) term directly, so the biases
      # cancel. Not added to the benchmarked_p* sets until it has been timed.
      - estimator: kraskov
        prop_k: 4

  StochasticInteraction: # No theiler window
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian
        labels:
          - M05
      - estimator: kozachenko
      - estimator: kernel

  # Mutual information
  MutualInfo:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

  # Mutual information
  TimeLaggedMutualInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

      - estimator: kraskov
        prop_k: 4
        dyn_corr_excl: AUTO

      - estimator: kernel
        kernel_width: 0.25

  # Transfer entropy
  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M04
    configs:
      # Kraskov estimator with auto-embedding on source/target and DCE
      - estimator: kraskov
        prop_k: 4
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 4

      - estimator: kraskov
        prop_k: 4
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 4
        dyn_corr_excl: AUTO

      # Kraskov estimator with auto-embedding on target-only, src history of 1, and DCE
      - estimator: kraskov
        prop_k: 4
        k_history: 2
        l_history: 1
        dyn_corr_excl: AUTO

      # Kraskov estimator with fixed embedding of 1 for source/target and DCE
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1
        dyn_corr_excl: AUTO

      # Same as above with no DCE
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1

      # Currently the Kernel method has an overload issue with the AIS calculator..
      # Kernel estimator with auto-embedding on source/target and DCE
      # - estimator: kernel
      #   auto_embed_method: MAX_CORR_AIS
      #   k_search_max: 4
      #   kernel_width: 0.25

      # Kernel estimator with no auto-embedding on source/target and DCE
      - estimator: kernel
        kernel_width: 0.25
        k_history: 1
        labels:
          - M14

      # Gaussian estimation has no Theiler/dynamic-correlation exclusion option
      - estimator: gaussian
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 2
        labels:
          - M05

      - estimator: gaussian
        k_history: 1
        l_history: 1
        labels:
          - M05
      # Disabled: k_history=1 gives a single ordinal symbol, so the transfer
      # entropy is identically zero. Rejected at construction; kept here as a
      # record of what was dropped.
      # - estimator: symbolic
      #   k_history: 1
      #   l_history: 1
      #   labels:
      #     - M05
      #
      # Disabled: severely undersampled and unvalidated at T=100. 10! symbols
      # against ~91 usable samples: on var1 and cml every joint count is 1, so
      # the value tracks sample size rather than dependence, but that does not
      # hold universally (kuramoto: 3 of 42 pairs). Still constructible, and
      # defensible for long series where the symbol space is populated.
      # - estimator: symbolic
      #   k_history: 10
      #   l_history: 1
      #   labels:
      #     - M05

  IntegratedInformation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M05
    dependencies: 
    configs:
      - phitype: "star"

      - phitype: "star"
        normalization: 1

      - phitype: "Geo"

      - phitype: "Geo"
        normalization: 1

# statistics that analyse in the frequency-domain (see Schoegl and Supp, 2006)
.statistics.spectral:
  CoherencePhase:
    labels:
      - linear
      - signed
      - antisymmetric
      - bivariate
      - frequency-dependent
      - M01
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

  CoherenceMagnitude:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  # Coherence (ordinal or squared? imaginary components of the coherence)
  ImaginaryCoherence:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  PhaseSlopeIndex:
    labels:
      - linear/nonlinear
      - unsigned
      - bivariate
      - frequency-dependent
      - M01
    dependencies:
    configs:
      - fmin: 0
        fmax: 0.5

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

  PhaseLockingValue:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M10
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max
        labels:
          - M12

      - fmin: 0
        fmax: 0.25
        statistic: max
        labels:
          - M12

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  PhaseLagIndex:
    labels:
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M07
    dependencies:
    configs:
      - fs: 1
        labels:
          - M14

      - fmin: 0
        fmax: 0.25
        labels:
          - M01

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M01

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  WeightedPhaseLagIndex:
    labels:
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M07
    dependencies:
    configs:
      - fs: 1
        labels:
          - M14

      - fmin: 0
        fmax: 0.25
        labels:
          - M01

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M01

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  DebiasedSquaredPhaseLagIndex:
    # NOTE: the `max` band statistic saturates on the data tested. The band
    # maximum reaches exactly 1 as soon as the sign of the imaginary coherency
    # is consistent across tapers at any ONE frequency. On the frozen fixtures
    # the share of pairs sitting at exactly 1 runs from 29% to 100% depending on
    # the data, with 1 to 16 distinct values; the `mean` variants are graded
    # normally. This is an empirical observation, not a law: saturation is NOT
    # monotone in T -- changing T recomputes the tapers and Fourier
    # coefficients, so the values at a longer series are not a superset of the
    # shorter one (measured non-monotone in 7 of 36 seed/band combinations).
    # Kept enabled: the statistic is behaving as defined. Read `max` values
    # near 1 with that in mind.
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M07
    dependencies:
    configs:
      - fs: 1
        labels:
          - M12

      - fmin: 0
        fmax: 0.25
        labels:
          - M12

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M12

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  DebiasedSquaredWeightedPhaseLagIndex:
    # NOTE: same saturation behaviour as DebiasedSquaredPhaseLagIndex above.
    # See that note.
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M07
    dependencies:
    configs:
      - fs: 1
        labels:
          - M12

      - fmin: 0
        fmax: 0.25
        labels:
          - M12

      - fmin: 0.25
        fmax: 0.5
        labels:
          - M12

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  PairwisePhaseConsistency:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  DirectedTransferFunction:
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M06
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  # partial_coherence:
  #   - fs: 1

  #   - fmin: 0
  #     fmax: 0.25

  #   - fmin: 0.25
  #     fmax: 0.5

  #   - fs: 1
  #     statistic: max

  #   - fmin: 0
  #     fmax: 0.25
  #     statistic: max

  #   - fmin: 0.25
  #     fmax: 0.5
  #     statistic: max

  DirectedCoherence:
    # Directed coherence is recomputed in pyspi (see DirectedCoherence in
    # statistics/spectral.py): the backend puts |H|^2 in the numerator while
    # the denominator is on the magnitude scale, which made it unbounded
    # (baselines reached 3.27 / 1.84 / 1139.47). The corrected form is bounded
    # in [0,1] and reproduces sqrt(directed_transfer_function()) to 4e-16 under
    # an identity noise covariance, which is the identity DC must satisfy.
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M06
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

  PartialDirectedCoherence:
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M06
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
