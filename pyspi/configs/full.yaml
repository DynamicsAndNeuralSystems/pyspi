# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: MinCovDet
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: GraphicalLassoCV
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: MinCovDet
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Precision
  Precision:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: MinCovDet
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: GraphicalLassoCV
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: MinCovDet
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Partial correlation
  PartialCorrelation:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: MinCovDet
      - estimator: OAS
      - estimator: ShrunkCovariance

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Kendall's rank correlation coefficient
  KendallTau:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Chatterjee's rank correlation xi
  ChatterjeeXi:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - M14
    dependencies:
    configs:
      - tau: 0
        labels:
          - contemporaneous
      - tau: 1
        labels:
          - time-dependent

  # Lagged correlation coefficient
  LaggedCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
      - MXX
    dependencies:
    configs:
      - estimator: pearson
        max_tau: 5
        squared: False
      - estimator: pearson
        max_tau: 5
        squared: True
      - estimator: pearson
        tau: 10
        squared: False
      - estimator: pearson
        tau: 10
        squared: True
      - estimator: pearson
        tau: 20
        squared: False
      - estimator: pearson
        tau: 20
        squared: True
      - estimator: spearman
        max_tau: 5
        squared: False
      - estimator: spearman
        max_tau: 5
        squared: True
      - estimator: spearman
        tau: 10
        squared: False
      - estimator: spearman
        tau: 10
        squared: True
      - estimator: spearman
        tau: 20
        squared: False
      - estimator: spearman
        tau: 20
        squared: True
      - estimator: kendall
        max_tau: 5
        squared: False
      - estimator: kendall
        max_tau: 5
        squared: True
      - estimator: kendall
        tau: 10
        squared: False
      - estimator: kendall
        tau: 10
        squared: True
      - estimator: kendall
        tau: 20
        squared: False
      - estimator: kendall
        tau: 20
        squared: True

  # Cross correlation
  CrossCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - statistic: "max"
        labels:
          - M10

      - statistic: "max"
        squared: True

      - statistic: "mean"

      - statistic: "mean"
        squared: True

      - statistic: "mean"
        sigonly: False

      - statistic: "mean"
        squared: True
        sigonly: False

# Distance-based statistics
.statistics.distance:
  # Pairwise distance
  PairwiseDistance:
    labels:
      - unsigned
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:
      - metric: "euclidean"
      - metric: "cityblock"
      - metric: "cosine"
      - metric: "chebyshev"
      - metric: "canberra"
      - metric: "braycurtis"

  # Distance correlation
  DistanceCorrelation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Multi-scale graph correlation
  MultiscaleGraphCorrelation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Hilbert-Schmidt independence criterion
  HilbertSchmidtIndependenceCriterion:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - biased: False
      - biased: True

  # Heller-Heller-Gorfine (HHG) test
  HellerHellerGorfine:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:

  # Multi-scale graph correlation for time series
  CrossMultiscaleGraphCorrelation:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - max_lag: 1
      - max_lag: 10

  # Distance correlation for time series
  CrossDistanceCorrelation:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - max_lag: 1
      - max_lag: 10

  # Dynamic time warping
  DynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  # Cross pairwise distance
  CrossPairwiseDistance:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - MXX
    dependencies:
    configs:
      - metric: "euclidean"
        tau: 1
        statistic: "min"
      - metric: "euclidean"
        tau: 1
        statistic: "mean"

  # Soft dynamic time warping
  SoftDynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  # Longest common subsequence
  LongestCommonSubsequence:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: null
      - global_constraint: itakura
      - global_constraint: sakoe_chiba

  # Barycenter
  Barycenter:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - mode: euclidean
        statistic: max
      - mode: dtw
        statistic: corr
        labels:
          - M09
      - mode: dtw
        statistic: max
      - mode: sgddtw
        statistic: corr
        labels:
          - M09
      - mode: sgddtw
        statistic: max
      - mode: softdtw
        statistic: corr
        labels:
          - M09
      - mode: softdtw
        statistic: max

      - mode: euclidean
        statistic: mean
        squared: True

      - mode: euclidean
        statistic: max
        squared: True

      - mode: dtw
        statistic: max
        squared: True

      - mode: sgddtw
        statistic: max
        squared: True

      - mode: softdtw
        statistic: max
        squared: True

  # Gromov-Wasserstein distance (GW_tau)
  GromovWasserstainTau:
    labels:
      - unsigned
      - distance
      - unordered
      - nonlinear
      - undirected
      - MXX
    dependencies:
    configs:

