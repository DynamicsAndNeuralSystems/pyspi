# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance

.statistics.distance:
  DynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate 
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: itakura

  Barycenter:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - mode: dtw
        statistic: mean
        labels:
          - M09

.statistics.causal:

  # Additive noise model
  AdditiveNoiseModel:
    labels:
      - directed, 
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:


# Information-theoretic statistics
.statistics.infotheory:
  DirectedInfo: # No theiler window yet
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
      - estimator: gaussian
      # Disabled: composing directed information from four separately-estimated
      # entropies leaves each with its own dimension-dependent bias, and they do
      # not cancel. On independent data the kernel variant sat at 3.8-4.4 for
      # every T from 100 to 8000 (a fixed bandwidth in ~11 dimensions does not
      # improve with sample size) and kozachenko returned negatives, for a
      # quantity bounded below by zero. Use estimator: kraskov, which estimates
      # each conditional-MI term directly.
      # - estimator: kernel
      # - estimator: kozachenko

  # Transfer entropy
  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M04
    configs:
      - estimator: kraskov
        prop_k: 4
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 4
        dyn_corr_excl: AUTO
  
      # Disabled: k_history=1 gives a single ordinal symbol, so the transfer
      # entropy is identically zero. Rejected at construction; kept here as a
      # record of what was dropped.
      # - estimator: symbolic
      #   k_history: 1
      #   l_history: 1
      #   labels:
      #     - M05
      #
      # Disabled: severely undersampled and unvalidated at T=100. 10! symbols
      # against ~91 usable samples: on var1 and cml every joint count is 1, so
      # the value tracks sample size rather than dependence, but that does not
      # hold universally (kuramoto: 3 of 42 pairs). Still constructible, and
      # defensible for long series where the symbol space is populated.
      # - estimator: symbolic
      #   k_history: 10
      #   l_history: 1
      #   labels:
      #     - M05

  # Integrated information
  IntegratedInformation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M05
    dependencies: 
    configs:
      - phitype: 'star'

# statistics that analyse in the frequency-domain (see Schoegl and Supp, 2006)
.statistics.spectral:

  CoherenceMagnitude:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - fs: 1

  PhaseSlopeIndex:
    labels:
      - linear/nonlinear
      - unsigned
      - bivariate
      - frequency-dependent
      - time-frequency dependent
      - M01
    dependencies:
    configs:
      - fmin: 0
        fmax: 0.5

  PhaseLagIndex:
    labels:
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M07
    dependencies:
    configs:
      - fs: 1
        statistic: max

  SpectralGrangerCausality:
      # Non-parametric Granger causality (no VAR model)
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M06
    dependencies:
    configs:
      - method: nonparametric
        fmin: 0
        fmax: 0.5
        statistic: mean

# statistics that analyse in the wavlet-domain (only Mortlet wavelet's at the moment)
.statistics.wavelet:
  PhaseSlopeIndex:
    labels:
      - linear/nonlinear
      - unsigned
      - bivariate
      - frequency-dependent
      - time-frequency dependent
      - M08
    dependencies:
    configs:
      - fs: 1

.statistics.misc:
  # Cointegration
  Cointegration:
    labels:
      - linear
      - unsigned
      - bivariate
      - time-dependent
      - M13
    dependencies:
    configs:
      - method: aeg
        statistic: tstat
        autolag: aic
        maxlag: 10
        trend: ct

  # Power envelope correlation
  PowerEnvelopeCorrelation:
    labels:
      - undirected, 
      - linear
      - unsigned
      - bivariate
      - time-dependent
      - M11
    dependencies:
    configs:
      - orth: False
        log: False
        absolute: False
