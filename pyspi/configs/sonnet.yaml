# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
      - M14
    dependencies:
    configs:
      - estimator: EmpiricalCovariance

# Distance-based statistics
.statistics.distance:
  DynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M10
    dependencies:
    configs:
      - global_constraint: itakura

  Barycenter:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M14
    dependencies:
    configs:
      - mode: dtw
        statistic: corr
        labels:
          - M09

# Causal inference statistics
.statistics.causal:

  # Additive noise model
  AdditiveNoiseModel:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
      - M02
    dependencies:
    configs:


# Information-theoretic statistics
.statistics.infotheory:
  DirectedInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M03
    configs:
      - estimator: gaussian

  # Transfer entropy
  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M04
    configs:
      - estimator: kraskov
        prop_k: 4
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 4
        dyn_corr_excl: AUTO
  

  # Integrated information
  IntegratedInformation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
      - M05
    dependencies: 
    configs:
      - phitype: 'star'

# Spectral (frequency-domain) statistics (see Schoegl and Supp, 2006)
.statistics.spectral:

  CoherenceMagnitude:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M12
    dependencies:
    configs:
      - fs: 1

  PhaseSlopeIndex:
    labels:
      - linear/nonlinear
      - unsigned
      - bivariate
      - frequency-dependent
      - M01
    dependencies:
    configs:
      - fmin: 0
        fmax: 0.5

  PhaseLagIndex:
    labels:
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M07
    dependencies:
    configs:
      - fs: 1
        statistic: mean
        labels:
          - M14

  SpectralGrangerCausality:
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
      - M06
    dependencies:
    configs:
      - method: nonparametric
        fmin: 0
        fmax: 0.5
        statistic: mean

# Wavelet (time-frequency) statistics, from Morlet wavelets
.statistics.wavelet:
  PhaseSlopeIndex:
    labels:
      - unsigned
      - time/frequency dependent
      - bivariate
      - M08
    dependencies:
    configs:
      - fs: 1

# Miscellaneous statistics
.statistics.misc:
  # Cointegration
  Cointegration:
    labels:
      - linear
      - unsigned
      - bivariate
      - time-dependent
      - M13
    dependencies:
    configs:
      - method: aeg
        statistic: tstat
        autolag: aic
        maxlag: 10
        trend: ct

  # Power envelope correlation
  PowerEnvelopeCorrelation:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - time-dependent
      - M11
    dependencies:
    configs:
      - orth: False
        log: False
        absolute: False
